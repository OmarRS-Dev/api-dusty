spring.application.name=sandoval
server.port=${PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.hikari.data-source-properties.createDatabaseIfNotExist=true

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=900
app.auth.refresh-idle-seconds=2592000
app.auth.refresh-absolute-seconds=7776000
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Máximo de conexiones simultáneas (para un MVP, 10 es un número sano)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Limita el número de hilos de ejecución. Menos hilos = menos uso de RAM.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

spring.jmx.enabled=false

# Evita que Hibernate guarde estadísticas en memoria
spring.jpa.properties.hibernate.generate_statistics=false

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024
